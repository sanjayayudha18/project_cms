name: CMS-Backend-CIT

# Run the shared infra compose first (from repo root) so the `cms-net`
# external network and Redis exist:
#   docker compose up -d
# Then, from this directory:
#   docker compose up --build

services:
  backend-cit:
    build:
      context: ..
      dockerfile: backend-cit/Dockerfile
    image: cms-backend-cit
    container_name: cms-backend-cit
    ports:
      - "8081:8081"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cms-net

networks:
  cms-net:
    name: cms-net
    external: true
