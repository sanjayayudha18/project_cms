version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: "../backend/migrations/"
    gen:
      go:
        package: "repository"
        out: "internal/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
