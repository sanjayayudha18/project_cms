name: CMS-Backend-EXQ

# Depends on backend/docker-compose.yaml having created the `cms-net`
# network + Redis first:
#   cd ../backend && docker compose up -d
# Then, from this directory:
#   docker compose up --build

services:
  backend-exq:
    build:
      context: ..
      dockerfile: backend-exq/Dockerfile
    image: cms-backend-exq
    container_name: cms-backend-exq
    ports:
      - "8081:8081"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cms-net

networks:
  cms-net:
    name: cms-net
    external: true
