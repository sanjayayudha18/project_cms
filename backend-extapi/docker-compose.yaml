name: CMS-Backend-EXTAPI

# Depends on backend/docker-compose.yaml having created the `cms-net`
# network + Redis first:
#   cd ../backend && docker compose up -d
# Then, from this directory:
#   docker compose up --build
# CLI (create/rotate API clients): docker compose run --rm backend-extapi ./extclient

services:
  backend-extapi:
    build:
      context: ..
      dockerfile: backend-extapi/Dockerfile
    image: cms-backend-extapi
    container_name: cms-backend-extapi
    ports:
      - "8082:8082"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cms-net

networks:
  cms-net:
    name: cms-net
    external: true
