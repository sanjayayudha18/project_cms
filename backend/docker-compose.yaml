name: CMS-Backend

# Owns Redis + the `cms-net` network. Run this FIRST:
#   docker compose up --build
# backend-cit/docker-compose.yaml joins `cms-net` as external — start it
# after this one is up (or at least after `docker compose up -d` here has
# created the network).

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: cms-backend-api
    container_name: cms-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cms-net

  redis:
    image: redis:7-alpine
    container_name: cms-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - cms-net

networks:
  cms-net:
    name: cms-net
    driver: bridge
