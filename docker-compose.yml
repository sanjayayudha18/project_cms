name: CMS-Infra

# Shared infrastructure for local dev — Redis only, on a network both
# backend/docker-compose.yaml and backend-cit/docker-compose.yaml join as
# `external: true`. Start this FIRST:
#   docker compose up -d
# Then start either backend independently from its own directory:
#   cd backend && docker compose up --build
#   cd backend-cit && docker compose up --build

services:
  redis:
    image: redis:7-alpine
    container_name: cms-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - cms-net

networks:
  cms-net:
    name: cms-net
    driver: bridge
