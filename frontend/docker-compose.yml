name: CMS-FE-Group  # Groups everything cleanly

services:
  # ─── CompanyPortal Frontend ────────────────────────────────────────────────
  userportal:
    build:
      context: ./CompanyPortal-Vite
      dockerfile: Dockerfile
    image: companyportal-vite-fe
    container_name: userportal-vite-fe
    ports:
      - "3001:80"
    restart: unless-stopped
    networks:
      - cms-net

  # ─── VendorPortal Frontend ─────────────────────────────────────────────────
  vendorportal:
    build:
      context: ./VendorPortal-Vite
      dockerfile: Dockerfile
    image: vendorportal-vite-fe
    container_name: vendorportal-vite-fe
    ports:
      - "3002:80"
    restart: unless-stopped
    networks:
      - cms-net

networks:
  cms-net:
    driver: bridge
