name: CMS-frontEnd

services:
  # ─── CompanyPortal Frontend ────────────────────────────────────────────────
  userportal:
    build:
      context: ./CompanyPortal-Vite
      dockerfile: Dockerfile
    image: companyportal-vite-fe
    container_name: userportal-vite-fe
    ports:
      - "3001:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cms-net

  # ─── VendorPortal Frontend ─────────────────────────────────────────────────
  vendorportal:
    build:
      context: ./VendorPortal-Vite
      dockerfile: Dockerfile
    image: vendorportal-vite-fe
    container_name: vendorportal-vite-fe
    ports:
      - "3002:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cms-net

networks:
  cms-net:
    external: true
    name: cms-net
