# graphify-human: peta fitur yang dibaca manusia.
#
# Pilot 3 fitur (2026-10-23), diperluas ke semua fitur di development-plan.md
# "Built and wired" + layar mock (2026-11-04).
#
# Fitur baru: tambah satu blok [[feature]], lalu jalankan generator. Satu file
# boleh dimiliki lebih dari satu fitur (kolom "Milik fitur" di halaman fitur).
#
# Jalankan dari root repo:  py graphify-human/generate.py   (Python 3.13+, stdlib saja)
# Hasil: graphify-human/out/index.md + satu <id>.md per fitur.
#
# File ini SATU-SATUNYA yang diedit manual. Generator (generate.py) membaca:
#   - file ini              -> label bisnis, status, file inti per fitur
#   - graphify-out/graph.json -> dependensi file ke file (impor/panggilan) untuk
#                              "file terkait" di luar file inti
#   - source code langsung  -> endpoint (chi Routes), panggilan API frontend,
#                              tabel DB (SQL di backend/queries + SQL inline),
#                              role guard (RequireRoles / requireRoles / navigation.ts)
#
# Aturan isi:
#   - `files` = glob relatif ke root repo. Test, kode generated, dan config
#     selalu dibuang otomatis walau cocok dengan glob (lihat [exclude]).
#   - `status` diisi manual dari development-plan.md:
#       built | partial | mock | not_built
#   - `mock_files` = file yang masih data hardcoded; tetap tampil, ditandai "mock".
#   - Nama fitur bahasa Indonesia, nama teknis (file, tabel, endpoint) tetap asli.

[exclude]
globs = [
  "**/*_test.go",
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/__tests__/**",
  "**/test_*.py",
  "backend/internal/db/*.sql.go",   # sqlc generated
  "backend-exq/internal/repository/*.sql.go",   # sqlc generated
  "backend-exq/internal/repository/db.go",
  "backend-exq/internal/repository/models.go",
  "**/routeTree.gen.ts",
  "**/*schema.d.ts",                 # schema.d.ts + exq-schema.d.ts (openapi-typescript)
  "**/tsconfig*.json",
  "**/package.json",
  "**/biome.json",
  "archives/**",
  ".opencode/**",
  ".claude/worktrees/**",
  "**/*.md",
  "**/*.log",
  "**/.env*",
  "**/requirements.txt",
  "**/__init__.py",
  "**/__pycache__/**",
]

