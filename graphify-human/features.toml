# graphify-human: peta fitur yang dibaca manusia.
#
# DRAFT pilot (2026-10-23), 3 fitur. Review dulu sebelum generator dibuat.
#
# File ini SATU-SATUNYA yang diedit manual. Generator (belum dibuat) membaca:
#   - file ini              -> label bisnis, status, file inti per fitur
#   - graphify-out/graph.json -> dependensi file ke file (impor/panggilan) untuk
#                              "file terkait" di luar file inti
#   - source code langsung  -> endpoint (chi Routes), panggilan API frontend,
#                              tabel DB (SQL di backend/queries + SQL inline),
#                              role guard (RequireRoles / requireRoles / navigation.ts)
#
# Aturan isi:
#   - `files` = glob relatif ke root repo. Test, kode generated, dan config
#     selalu dibuang otomatis walau cocok dengan glob (lihat [exclude]).
#   - `status` diisi manual dari development-plan.md:
#       built | partial | mock | not_built
#   - `mock_files` = file yang masih data hardcoded; tetap tampil, ditandai "mock".
#   - Nama fitur bahasa Indonesia, nama teknis (file, tabel, endpoint) tetap asli.

[exclude]
globs = [
  "**/*_test.go",
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/__tests__/**",
  "**/test_*.py",
  "backend/internal/db/*.sql.go",   # sqlc generated
  "**/routeTree.gen.ts",
  "**/schema.d.ts",
  "**/tsconfig*.json",
  "**/package.json",
  "**/biome.json",
  "archives/**",
  ".opencode/**",
  ".claude/worktrees/**",
  "**/*.md",
  "**/*.log",
  "**/.env*",
  "**/requirements.txt",
  "**/__init__.py",
  "**/__pycache__/**",
]

